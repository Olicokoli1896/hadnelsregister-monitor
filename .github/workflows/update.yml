name: Handelsregister-Update

on:
  schedule:
    # täglich 05:17 Uhr UTC (06:17 / 07:17 Uhr deutscher Zeit)
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      no_mail:
        description: "Ohne E-Mail-Versand"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hr-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Daten abrufen, Website bauen, Mails senden
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          if [ "${{ inputs.no_mail }}" = "true" ]; then
            python -m hr_monitor run --no-mail
          else
            python -m hr_monitor run
          fi

      - name: Ergebnisse speichern
        run: |
          git config user.name "hr-monitor-bot"
          git config user.email "hr-monitor-bot@users.noreply.github.com"
          git add data/state docs
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Update $(date -u +%Y-%m-%d)"
            git push
          fi
