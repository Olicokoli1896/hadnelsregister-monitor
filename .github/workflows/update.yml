name: Handelsregister-Update

on:
  schedule:
    # alle zwei Tage um 03:17 Uhr UTC (04:17 / 05:17 Uhr deutscher Zeit).
    # Hinweis: */2 bezieht sich auf den Kalendertag (1., 3., 5. …); am Monatsende
    # kann der Abstand daher einmal einen oder drei Tage betragen.
    - cron: "17 3 */2 * *"
  workflow_dispatch:
    inputs:
      no_mail:
        description: "Ohne E-Mail-Versand"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hr-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Adresse der Website für die Links in den Mails, z. B. https://<projekt>.pages.dev/
      # (Repo → Settings → Secrets and variables → Actions → Variables). Leer = config.yaml.
      SITE_URL: ${{ vars.SITE_URL }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Daten abrufen, Website bauen, Mails senden
        # Sicherheitsgrenze: bricht der Lauf ab, werden die Zwischenstände
        # trotzdem gespeichert; nicht versendete Einträge folgen beim nächsten Lauf.
        timeout-minutes: 320
        continue-on-error: true
        env:
          # Gmail (empfohlen): SMTP_USER = Gmail-Adresse, SMTP_PASSWORD = App-Passwort.
          # SMTP_HOST/SMTP_PORT leer = smtp.gmail.com:587. MAIL_TO bekommt alle Regionen.
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # Alternativ Resend: ist RESEND_API_KEY gesetzt, hat Resend Vorrang vor SMTP.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Verteiler je Region (mehrere Adressen durch Komma getrennt)
          EMPFAENGER_HANNOVER: ${{ secrets.EMPFAENGER_HANNOVER }}
          EMPFAENGER_BRAUNSCHWEIG: ${{ secrets.EMPFAENGER_BRAUNSCHWEIG }}
          EMPFAENGER_GOETTINGEN: ${{ secrets.EMPFAENGER_GOETTINGEN }}
          EMPFAENGER_HALBERSTADT: ${{ secrets.EMPFAENGER_HALBERSTADT }}
          EMPFAENGER_WOLFSBURG: ${{ secrets.EMPFAENGER_WOLFSBURG }}
        run: |
          if [ "${{ inputs.no_mail }}" = "true" ]; then
            python -m hr_monitor run --no-mail
          else
            python -m hr_monitor run
          fi

      - name: Website aktualisieren
        if: always()
        run: python -m hr_monitor site

      - name: Ergebnisse speichern
        if: always()
        run: |
          git config user.name "hr-monitor-bot"
          git config user.email "hr-monitor-bot@users.noreply.github.com"
          git add data/state docs
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Update $(date -u +%Y-%m-%d)"
            git push
          fi
